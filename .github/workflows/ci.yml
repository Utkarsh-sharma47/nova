name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-checks:
    name: Phase 1 foundation checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docs structure
        run: ./scripts/check-docs-structure.sh

      - name: Secret patterns
        run: ./scripts/check-secret-patterns.sh

      # Application lint/type/test/build jobs are intentionally absent until a
      # language toolchain and application code exist. See docs/deployment/ci-cd.md.
