name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-checks:
    name: Docs and secrets checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docs structure
        run: ./scripts/check-docs-structure.sh

      - name: Secret patterns
        run: ./scripts/check-secret-patterns.sh

  python:
    name: Ruff, MyPy, pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nova:nova@localhost:5432/nova_test
      TEST_DATABASE_URL: postgresql+asyncpg://nova:nova@localhost:5432/nova_test
      API_AUTH_TOKEN: test-token-not-for-production
      APP_ENV: test
      DOCUMENT_STORAGE_PATH: ./data/uploads
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy

      - name: Alembic upgrade
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nova-api:ci .
