name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-checks:
    name: Docs and secrets checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docs structure
        run: ./scripts/check-docs-structure.sh

      - name: Secret patterns
        run: ./scripts/check-secret-patterns.sh

  python:
    name: Python (Ruff, MyPy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      API_AUTH_TOKEN: nova-test-token
      TEST_DATABASE_URL: postgresql+psycopg://nova:nova@localhost:5432/nova_test
      DATABASE_URL: postgresql+psycopg://nova:nova@localhost:5432/nova_test
      DOCUMENT_STORAGE_PATH: ./var/ci-documents
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p "${DOCUMENT_STORAGE_PATH}"

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy

      - name: Tests
        run: pytest -q

      - name: Validate clean migration and revision
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic upgrade head
          alembic current | grep -q 0001_phase3_foundation
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect

          required = {
              "customers",
              "shipments",
              "documents",
              "document_versions",
              "verification_runs",
              "idempotency_records",
          }
          engine = create_engine(os.environ["DATABASE_URL"])
          assert required <= set(inspect(engine).get_table_names())
          engine.dispose()
          PY

      - name: Build API image
        run: docker build -t nova-api:ci .
