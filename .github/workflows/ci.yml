name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-checks:
    name: Docs and secrets checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docs structure
        run: ./scripts/check-docs-structure.sh

      - name: Secret patterns
        run: ./scripts/check-secret-patterns.sh

  python-contracts:
    name: Python contracts (Ruff, MyPy, pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests

      - name: MyPy
        run: mypy

      - name: Contract tests
        run: pytest -q
