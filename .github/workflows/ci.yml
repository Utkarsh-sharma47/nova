name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-checks:
    name: Docs and secrets checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Docs structure
        run: ./scripts/check-docs-structure.sh
      - name: Secret patterns
        run: ./scripts/check-secret-patterns.sh

  python:
    name: Python (Ruff, MyPy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      API_AUTH_TOKEN: nova-test-token
      TEST_DATABASE_URL: postgresql+psycopg://nova:nova@localhost:5432/nova_test
      DATABASE_URL: postgresql+psycopg://nova:nova@localhost:5432/nova_test
      DOCUMENT_STORAGE_PATH: ./var/ci-documents
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          mkdir -p "${DOCUMENT_STORAGE_PATH}"
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy
      - name: Tests
        run: pytest -q
      - name: Validate clean migration and revision
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic upgrade head
          alembic current | grep -q 0004_phase7_pipeline
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          required = {
              "customers",
              "shipments",
              "documents",
              "document_versions",
              "verification_runs",
              "idempotency_records",
              "agent_executions",
              "model_call_metadata",
              "extracted_fields",
              "decisions",
              "validations",
          }
          engine = create_engine(os.environ["DATABASE_URL"])
          assert required <= set(inspect(engine).get_table_names())
          engine.dispose()
          PY
      - name: Dependency audit (runtime)
        run: |
          python -m pip install --upgrade "pip>=25" pip-audit
          set +e
          pip-audit --progress-spinner=off
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::pip-audit reported findings (exit $status); see job log"
          fi
      - name: Build API image
        run: docker build -t nova-api:ci .

  frontend:
    name: Frontend (typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: Build web image
        working-directory: .
        run: docker build -t nova-web:ci ./frontend
