# Local / demo topology for Part 1 (Phase 2 shape).
# API service is a skeleton until Phase 3+.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: nova
      POSTGRES_DB: nova
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nova_pg:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://nova:nova@db:5432/nova
      LLM_PROVIDER: mock
      LOG_LEVEL: INFO
      # API_AUTH_TOKEN: set locally; do not commit secrets
    depends_on:
      db:
        condition: service_healthy

volumes:
  nova_pg:
